<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ambient-agent</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --line: #23272e;
    --text: #e6e8ea;
    --dim: #8b929c;
    --you: #1e2530;
    --accent: #4c8dff;
    --warn: #ffb84c;
    --bad: #ff6b6b;
    --good: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--dim); flex: none;
  }
  .dot.listening { background: var(--accent); animation: pulse 1s infinite; }
  .dot.thinking  { background: var(--warn);   animation: pulse 1.4s infinite; }
  .dot.speaking  { background: var(--good);   animation: pulse .8s infinite; }
  .dot.acting    { background: var(--good); }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .meta { color: var(--dim); font-size: 13px; margin-left: auto; text-align: right; }
  .badge {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; font-size: 12px; color: var(--dim);
  }
  #banner {
    display: none; padding: 8px 18px; font-size: 13px;
    background: #1d1a12; color: var(--warn); border-bottom: 1px solid var(--line);
  }
  main {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 68ch; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; }
  .msg.you    { background: var(--you); align-self: flex-end; }
  .msg.agent  { background: var(--panel); border: 1px solid var(--line); }
  .msg.system { color: var(--dim); font-size: 13px; align-self: center; background: none; }
  .role { font-size: 11px; color: var(--dim); margin-bottom: 3px; letter-spacing: .04em; }
  #partial {
    color: var(--accent); font-style: italic; min-height: 22px;
    padding: 0 18px 6px; font-size: 14px;
  }
  footer { padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  form { display: flex; gap: 9px; }
  input[type=text] {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 13px; font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 9px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 7px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <h1>ambient-agent</h1>
  <span class="badge" id="mode">ambient</span>
  <span class="badge" id="provider">rules only</span>
  <div class="meta">
    <div id="activity">idle</div>
    <div id="status"></div>
  </div>
</header>

<div id="banner"></div>

<main id="log"></main>
<div id="partial"></div>

<footer>
  <form id="form">
    <input type="text" id="input" placeholder="Type a command, or just talk to it" autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
  </form>
  <div class="hint">
    Try <code>set volume to 40</code> &middot; <code>timer for 10 minutes</code> &middot;
    <code>what's 12 * 8</code> &middot; <code>stop</code>. Anything the rules do not
    recognise goes to the AI model, or is refused if none is configured.
  </div>
</footer>

<script>
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const partialEl = document.getElementById('partial');
const bannerEl = document.getElementById('banner');
let lastPartial = '';

function atBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 60;
}

function addMessage(m) {
  const stick = atBottom();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + m.role;
  if (m.role !== 'system') {
    const role = document.createElement('div');
    role.className = 'role';
    role.textContent = m.role === 'you' ? 'YOU' : 'AGENT';
    wrap.appendChild(role);
  }
  const body = document.createElement('div');
  body.textContent = m.text;
  wrap.appendChild(body);
  log.appendChild(wrap);
  if (stick) log.scrollTop = log.scrollHeight;
}

function applyState(s) {
  document.getElementById('activity').textContent = s.activity || 'idle';
  document.getElementById('status').textContent = s.status_line || '';
  document.getElementById('mode').textContent = s.mode || 'ambient';
  dot.className = 'dot ' + (s.activity || '');
  const p = s.partial || '';
  if (p !== lastPartial) {
    lastPartial = p;
    partialEl.textContent = p ? 'hearing: ' + p : '';
  }
}

const es = new EventSource('/events');
es.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'state') applyState(msg.state);
  else if (msg.type === 'message') addMessage(msg.message);
  else if (msg.type === 'banner') {
    bannerEl.textContent = msg.text || '';
    bannerEl.style.display = msg.text ? 'block' : 'none';
  }
};
es.onerror = () => {
  bannerEl.textContent = 'Disconnected from the agent. Is it still running?';
  bannerEl.style.display = 'block';
};

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await fetch('/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
  } catch (err) {
    addMessage({ role: 'system', text: 'Could not reach the agent.' });
  }
});
</script>
</body>
</html>
